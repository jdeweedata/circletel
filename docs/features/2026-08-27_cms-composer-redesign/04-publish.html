<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>04 Publish</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="kit.css" />
</head>
<body class="admin">
  <div class="artboard">
    <div class="shell" style="height:900px;position:relative">
      <aside class="sidebar">
        <div class="sidebar-head"><span class="mark">C</span> Admin Panel</div>
        <div class="ws"><button class="ws-btn"><span class="dot">●</span> Sales</button></div>
        <nav class="nav">
          <div class="sec">Marketing</div>
          <a class="active">Landings</a>
        </nav>
      </aside>
      <main class="main">
        <div class="page">
          <header class="page-header">
            <div>
              <span class="eyebrow">Marketing</span>
              <h1>Landings</h1>
            </div>
            <span class="btn btn-accent">New landing</span>
          </header>
          <div class="grid-cards">
            <article class="thumb-card">
              <div class="thumb"></div>
              <div class="thumb-body"><h3>Winter 5G</h3><div class="thumb-url">/p/winter-5g</div></div>
            </article>
          </div>
        </div>
      </main>
      <div class="overlay">
        <div class="dialog">
          <h3>Publish Winter 5G</h3>
          <div class="body">
            <div class="field">
              <label>Public URL</label>
              <input value="https://www.circletel.co.za/p/winter-5g" readonly />
            </div>
            <div class="field">
              <label>Index in search</label>
              <select><option>Yes — follow and index</option><option>No — noindex</option></select>
            </div>
            <p style="margin:0;font-size:13px;color:var(--pm-body);line-height:1.5">
              This does not change <strong>/5g-deals</strong>. Checkout, coverage, and prices stay on the catalogue.
            </p>
          </div>
          <div class="foot">
            <button class="btn btn-ghost">Keep draft</button>
            <button class="btn btn-accent">Publish now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
