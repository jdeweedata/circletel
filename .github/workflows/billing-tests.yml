name: Billing Invoice Number Tests

# Guards the INV-YYYY-NNNNN allocator. Two live paths once minted numbers with
# Math.random() against a UNIQUE column (fixed in #808/#809); nothing in CI would
# have caught a regression, because the only Jest workflow is scoped to
# lib/payments and lib/types.
#
# Scope note: deliberately runs the three numbering suites, not all of
# __tests__/lib/billing. The wider billing folder (~18 suites) has never run in
# CI, so its current state is unknown. Widen the last step once someone has run
# `npm test -- __tests__/lib/billing` locally and confirmed it is green.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'lib/billing/**'
      - 'app/api/admin/billing/**'
      - 'lib/inngest/functions/b2b-site-activation-invoice.ts'
      - '__tests__/lib/billing/**'
      - '.github/workflows/billing-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/billing/**'
      - 'app/api/admin/billing/**'
      - 'lib/inngest/functions/b2b-site-activation-invoice.ts'
      - '__tests__/lib/billing/**'

concurrency:
  group: billing-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Billing Invoice Number Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No --coverage: jest file-level thresholds are tuned for lib/payments and
      # would fail at 0% when only these suites run.
      - name: Run invoice number tests
        run: |
          npm test -- \
            __tests__/lib/billing/allocate-invoice-number.test.ts \
            __tests__/lib/billing/generate-corporate-consolidated-invoice.test.ts \
            __tests__/lib/billing/invoice-amounts.test.ts
        env:
          NODE_ENV: test
